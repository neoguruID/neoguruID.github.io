<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Detektif Junior - NeoGuru</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="shortcut icon" href="../../favicon.png" type="image/x-icon" />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #dfeeea;
        --card: #fff;
        --ink: #12293f;
        --mut: #55697a;
        --line: #b9d0cb;
        --pri: #1c5d99;
        --priS: #dcebf9;
        --hl: #ffd23f;
        --ok: #1f7a45;
        --okS: #d9f3e2;
        --bad: #b3204f;
        --badS: #fde3ec;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0e1c24;
          --card: #162a35;
          --ink: #e8f3f1;
          --mut: #8fa9b3;
          --line: #2a4553;
          --pri: #6db3f2;
          --priS: #1d3a52;
          --ok: #51cf84;
          --okS: #16352360;
          --bad: #ff7aa8;
          --badS: #3d1d2b;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0e1c24;
        --card: #162a35;
        --ink: #e8f3f1;
        --mut: #8fa9b3;
        --line: #2a4553;
        --pri: #6db3f2;
        --priS: #1d3a52;
        --ok: #51cf84;
        --okS: #16352360;
        --bad: #ff7aa8;
        --badS: #3d1d2b;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        background-color: var(--bg);
        background-image: radial-gradient(var(--line) 1.2px, transparent 1.2px);
        background-size: 22px 22px;
        color: var(--ink);
        font-family: "Atkinson Hyperlegible", system-ui, sans-serif;
        min-height: 100%;
      }
      .hd {
        font-family: "Bricolage Grotesque", "Atkinson Hyperlegible", sans-serif;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .card {
        background: var(--card);
        border: 2px solid var(--ink);
        border-radius: 1.1rem;
        padding: 1rem;
        box-shadow: 5px 5px 0 var(--ink);
      }
      .btn {
        background: var(--pri);
        color: #fff;
        font-weight: 700;
        border: 2px solid var(--ink);
        border-radius: 0.8rem;
        padding: 0.65rem 1.2rem;
        box-shadow: 3px 3px 0 var(--ink);
        transition:
          transform 0.08s,
          box-shadow 0.08s;
        cursor: pointer;
      }
      .btn:active {
        transform: translate(3px, 3px);
        box-shadow: 0 0 0 var(--ink);
      }
      .btn.hl {
        background: var(--hl);
        color: #12293f;
      }
      .btn.ghost {
        background: var(--card);
        color: var(--ink);
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .chip {
        border: 2px solid var(--line);
        background: var(--card);
        border-radius: 0.75rem;
        padding: 0.5rem 0.8rem;
        font-weight: 700;
        text-align: left;
        cursor: pointer;
        transition:
          border-color 0.1s,
          background 0.1s;
      }
      .chip:hover {
        border-color: var(--pri);
      }
      .chip.on {
        background: var(--hl);
        border-color: var(--ink);
        color: #12293f;
      }
      .chip.pin {
        border-style: dashed;
        border-color: var(--ink);
        background: var(--priS);
      }
      .fb {
        border-radius: 0.8rem;
        padding: 0.6rem 0.9rem;
        font-weight: 700;
        border: 2px solid;
      }
      .fb.ok {
        background: var(--okS);
        color: var(--ok);
        border-color: var(--ok);
      }
      .fb.no {
        background: var(--badS);
        color: var(--bad);
        border-color: var(--bad);
        animation: sh 0.3s;
      }
      .fb.hint {
        background: var(--priS);
        color: var(--pri);
        border-color: var(--pri);
      }
      @keyframes sh {
        25% {
          transform: translateX(-6px);
        }
        75% {
          transform: translateX(6px);
        }
      }
      @keyframes stamp {
        0% {
          transform: scale(2.2) rotate(-14deg);
          opacity: 0;
        }
        100% {
          transform: scale(1) rotate(-8deg);
          opacity: 1;
        }
      }
      .stamp {
        display: inline-block;
        border: 4px solid var(--bad);
        color: var(--bad);
        font-weight: 800;
        border-radius: 0.5rem;
        padding: 0.1rem 0.7rem;
        transform: rotate(-8deg);
        animation: stamp 0.35s ease-out;
      }
      .dot {
        width: 0.8rem;
        height: 0.8rem;
        border-radius: 99px;
        border: 2px solid var(--ink);
        background: var(--card);
      }
      .d1 {
        background: var(--ok);
      }
      .d2 {
        background: var(--hl);
      }
      .step {
        border: 2px solid var(--line);
        border-radius: 0.8rem;
        padding: 0.6rem 0.8rem;
        font-weight: 700;
      }
      .step.cur {
        border-color: var(--ink);
        background: var(--priS);
      }
      .step.done {
        border-color: var(--ok);
        background: var(--okS);
      }
      .step.wait {
        opacity: 0.55;
      }
      .num {
        border: 2px solid var(--ink);
        border-radius: 0.7rem;
        padding: 0.5rem 0.8rem;
        background: var(--card);
        color: var(--ink);
        width: 9rem;
        font-weight: 700;
      }
      .bar {
        height: 0.7rem;
        border: 2px solid var(--ink);
        border-radius: 99px;
        overflow: hidden;
        background: var(--card);
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--bad);
      }
      .ph {
        font-weight: 700;
        padding: 0.2rem 0.7rem;
        border-radius: 99px;
        border: 2px solid var(--line);
        color: var(--mut);
      }
      .ph.now {
        background: var(--hl);
        color: #12293f;
        border-color: var(--ink);
      }
      .ph.dn {
        background: var(--okS);
        color: var(--ok);
        border-color: var(--ok);
      }
      :focus-visible {
        outline: 3px solid var(--pri);
        outline-offset: 2px;
      }
      .pg {
        aspect-ratio: 297/210;
        container-type: inline-size;
        background: #fff;
        color: #12293f;
        border: 2px solid #12293f;
        position: relative;
        overflow: hidden;
        padding: 5cqw 6cqw 5cqw 8cqw;
      }
      .pg:before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 2.5cqw;
        background: #ffd23f;
      }
      .inp {
        border: 2px solid var(--ink);
        border-radius: 0.7rem;
        padding: 0.6rem 0.8rem;
        background: var(--card);
        color: var(--ink);
        width: 100%;
        font-weight: 700;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const $ = (s) => document.querySelector(s),
        fmt = (n) => n.toLocaleString("id-ID");
      const sh = (a) => {
        a = [...a];
        for (let i = a.length - 1; i > 0; i--) {
          const j = (Math.random() * (i + 1)) | 0;
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      };
      const NM = {
          goal: "Tujuan",
          data: "Bukti",
          plan: "Rencana",
          run: "Mesin",
        },
        IC = { goal: "🎯", data: "📌", plan: "🧩", run: "⚙️" };
      const DH = {
        goal: "Baca kalimat tanya di akhir cerita. Apa tepatnya yang diminta?",

        plan: "Hasil langkah mana yang dibutuhkan langkah berikutnya?",
        run: "Pakai hasil dari langkah sebelumnya.",
      };
      const CASES = [
        {
          e: "🍎",
          n: "Apel Bu Sari",
          st: "Bu Sari pergi ke pasar membawa tas belanja biru. Ia membeli 3 kg apel dengan harga Rp20.000 per kg dan tiba di pasar pukul 07.00. Berapa uang yang harus dibayar Bu Sari untuk apelnya?",
          f: [
            ["3 kg apel", 1],
            ["Rp20.000 per kg", 1],
            ["Tas belanja biru", 0],
            ["Tiba pukul 07.00", 0],
          ],
          g: [
            [
              "Total uang untuk apel",

            0,
          ],

          p: ["Kalikan jumlah kg × harga per kg (3 × 20.000)"],
          pd: ["Bagi 20.000 dengan 3"],

          a: "Rp60.000",
          h: {
            goal: "Kalimat tanyanya diawali “Berapa…”. Apa yang sebenarnya ditanyakan?",

        {

          f: [
            ["Uang Rp50.000", 1],
            ["2 buku @Rp8.000", 1],
            ["1 pulpen Rp4.000", 1],
            ["Toko alat tulis", 0],
          ],

          p: [
            "Hitung harga buku (2 × 8.000)",

            "Kurangi uang awal dengan total (50.000 − total)",
          ],
          pd: ["Jumlahkan uang awal dengan harga pulpen"],
          r: [16000, 20000, 30000],
          a: "Rp30.000",
          h: {
            goal: "Setelah Dini selesai belanja, uang yang mana yang ditanyakan?",
          },
        },
        {
          e: "🥤",
          n: "Bazar Es Teh",
          st: "Kelas 7A mengadakan bazar. Mereka menjual 24 gelas es teh seharga Rp3.000 per gelas. Modal membeli bahan Rp20.000. Bazar dibuka pukul 09.00 dan ada 30 siswa di kelas. Berapa keuntungan bazar kelas 7A?",
          f: [

            ["Rp3.000 per gelas", 1],
            ["Modal bahan Rp20.000", 1],
            ["Bazar buka pukul 09.00", 0],

          ],
          g: [

          p: [

          st: "Pak Budi berbelanja di Warung Makmur. Ia membeli 5 kg beras seharga Rp12.000 per kg dan 2 liter minyak seharga Rp15.000 per liter. Ia membayar dengan uang Rp100.000. Berapa uang kembalian yang diterima Pak Budi?",

          },
        },
        {

          n: "Iuran Tim Futsal",
          st: "Tim futsal kelas 8 memakai jersey merah. Setiap pertandingan, tim membayar sewa lapangan Rp45.000. Mereka bermain 3 pertandingan, dimulai pukul 15.00. Kas tim sudah berisi Rp100.000. Kekurangannya dibagi rata oleh 5 pemain. Berapa uang tambahan yang harus dibayar tiap pemain?",
          f: [
            ["Sewa Rp45.000 per pertandingan", 1],
            ["3 pertandingan", 1],
            ["Kas tim Rp100.000", 1],
            ["5 pemain, bayar sama rata", 1],
            ["Jersey berwarna merah", 0],
            ["Main mulai pukul 15.00", 0],

          g: [

            1,
          ],
          tip: "Ada banyak angka uang. Pilih yang dibayar oleh satu pemain, bukan seluruh tim.",
          p: [

            "Hitung kekurangan (total − kas 100.000)",
            "Bagi kekurangan dengan 5 pemain",
          ],
          pd: ["Bagi total sewa dengan 5", "Jumlahkan kas dengan total sewa"],
          r: [135000, 35000, 7000],
          a: "Rp7.000 per pemain",
          h: {
            goal: "Uang yang diminta itu untuk siapa: seluruh tim atau satu pemain?",
            plan: "Sebelum membagi ke pemain, kamu harus tahu berapa yang kurang. Itu butuh apa?",
          },
        },
        {
          e: "🌱",
          n: "Kebun Sekolah",
          st: "Sekolah membuat kebun kopi dengan 5 petak. Setiap petak berukuran 4 m × 3 m. Pagar kebun sudah dipasang kemarin dan 3 kelas akan menanam bersama. Pada setiap 1 m² ditanam 4 bibit kopi, harga bibit kopi Rp2.500 per bibit kopi. Berapa biaya seluruh bibit kopi yang dibutuhkan?",
          f: [
            ["5 petak kebun", 1],
            ["Ukuran petak 4 m × 3 m", 1],
            ["4 bibit tiap 1 m²", 1],
            ["Rp2.500 per bibit", 1],
            ["Pagar sudah dipasang", 0],
            ["3 kelas menanam bersama", 0],
          ],
          g: [
            [
              "Luas seluruh kebun",
              "Jumlah bibit",
              "Biaya seluruh bibit",
              "Banyak kelas",
            ],
            2,
            ["bibit", "meter persegi", "rupiah"],
            2,
          ],
          tip: "Hati-hati, ada beberapa hal yang bisa dihitung. Mana yang diminta di kalimat tanya?",
          p: [
            "Hitung luas satu petak (4 × 3)",
            "Hitung luas seluruh petak (× 5)",
            "Hitung jumlah bibit (× 4)",
            "Hitung biaya bibit (× 2.500)",
          ],
          pd: ["Hitung keliling satu petak", "Bagi biaya dengan 3 kelas"],
          r: [12, 60, 240, 600000],
          a: "Rp600.000",
        },
      ];
      const LEVELS = [
        {
          t: "Level 1: Apa yang Ditanyakan?",
          d: "Sebelum menghitung, temukan dulu apa yang sebenarnya diminta. Di level ini kamu hanya merumuskan Tujuan. Mesin yang mengerjakan sisanya.",
          ph: ["goal"],
          hint: 1,
          cases: [0, 1],
        },
        {
          t: "Level 2: Pilah Bukti",
          d: "Tidak semua info dalam cerita berguna. Pasang bukti penting di Papan Bukti dan abaikan pengecohnya.",
          ph: ["goal", "data"],
          hint: 1,
          cases: [2],
        },
        {
          t: "Level 3: Susun Rencana",
          d: "Sekarang kamu menyusun urutan langkah. Awas, ada langkah pengecoh yang tidak dibutuhkan.",
          ph: ["goal", "data", "plan"],
          hint: 1,
          cases: [3],
        },
        {
          t: "Level 4: Kasus Penuh",
          d: "Seluruh alur ada di tanganmu: Tujuan, Bukti, Rencana, lalu jalankan mesin dan hitung tiap langkahnya sendiri.",
          ph: ["goal", "data", "plan", "run"],
          hint: 1,
          cases: [4],
        },
        {
          t: "Level 5: Misi Akhir",
          d: "Kasus baru tanpa petunjuk. Buktikan kamu bisa memecahkannya sendiri.",
          ph: ["goal", "data", "plan", "run"],
          hint: 0,
          cases: [5],
        },
      ];
      const Q = LEVELS.flatMap((L, li) =>
        L.cases.map((c, k) => ({ li, c, first: !k })),
      );
      const KEY = "dr_v1",
        PK = ["name", "kelas", "cd", "c0", "c1", "coins", "hu", "err", "dt"];
      const def = () => ({
        scr: "menu",
        q: 0,
        fb: null,
        name: "",
        kelas: "",
        cd: {},
        c0: 0,
        c1: 0,
        coins: 5,
        hu: 0,
        dt: "",
        err: { goal: 0, data: 0, plan: 0, run: 0 },
      });
      let S = def();
      try {
        const p = JSON.parse(localStorage.getItem(KEY));
        if (p)
          PK.forEach((k) => {
            if (k in p) S[k] = p[k];
          });
      } catch (e) {}
      const save = () => {
        try {
          localStorage.setItem(
            KEY,
            JSON.stringify(Object.fromEntries(PK.map((k) => [k, S[k]]))),
          );
        } catch (e) {}
      };
      const LV = () => LEVELS[Q[S.q].li],
        PH = () => LV().ph[S.ph];
      const wrap = (v) =>
        `<div class="max-w-6xl mx-auto p-3 md:p-6"><header class="flex flex-wrap items-center justify-between gap-3 mb-4"><div class="flex items-center gap-2"><span class="text-3xl">🕵️</span><span class="hd text-2xl md:text-3xl">Detektif Junior</span></div><div class="flex items-center gap-1.5">${Q.map((_, i) => `<span class="dot ${S.cd[i] ? "d1" : i == S.q && ["play", "sum"].includes(S.scr) ? "d2" : ""}"></span>`).join("")}</div><div class="chip !py-1 !px-3 cursor-default">🪙 ${S.coins}</div></header>${v}</div>`;
      function R() {
        const v = { menu, how, abt, reg, lv, intro, play, sum, fin, cert }[
          S.scr
        ]();
        $("#app").innerHTML = wrap(v);
        const i = $("#in");
        if (i) i.focus();
      }
      function start() {
        return `<div class="grid md:grid-cols-2 gap-6 items-center mt-2 md:mt-10"><div><div class="stamp text-lg mb-3">KASUS TERBUKA</div><h1 class="hd text-4xl md:text-6xl leading-none">Temukan dulu masalahnya. Hitung belakangan.</h1><p class="mt-4 text-lg text-[var(--mut)] max-w-md">Kamu detektif junior. Setiap laporan warga berisi cerita berbelit penuh angka. Tugasmu: rumuskan tujuan, kumpulkan bukti, susun rencana, lalu jalankan mesin.</p></div><div class="card"><p class="hd text-xl">Sebelum mulai</p><p class="mt-1 text-[var(--mut)]">Seberapa yakin kamu bisa memecahkan soal cerita yang belum pernah kamu lihat?</p><div class="grid grid-cols-5 gap-2 mt-3">${["😟", "🙁", "😐", "🙂", "😎"].map((x, i) => `<button class="chip text-center text-2xl ${S.c0 == i + 1 ? "on" : ""}" data-a="c0" data-i="${i}" aria-label="Yakin ${i + 1} dari 5">${x}</button>`).join("")}</div><button class="btn hl w-full mt-4 text-lg" data-a="go" ${S.c0 ? "" : "disabled"}>Mulai penyelidikan</button><p class="text-sm text-[var(--mut)] mt-3">Pilih satu wajah dulu. Kamu akan memilihnya lagi di akhir.</p></div></div>`;
      }

              s = L.cases.reduce((a, c) => a + (S.cd[c] ? S.cd[c].s : 0), 0),
              on = o && !d;
            return `<button class='card text-left ${on ? "" : "opacity-70"}' data-a='open' data-i='${i}' ${on ? "" : "disabled"}><div class='flex justify-between items-center'><span class='hd text-4xl'>${i + 1}</span><span class='text-2xl'>${d ? "✅" : o ? "🔓" : "🔒"}</span></div><p class='hd text-xl mt-1'>${L.t.split(": ")[1]}</p><p class='text-[var(--mut)] mt-1'>${d ? "⭐ " + s + " dari " + L.cases.length * 3 : o ? "Terbuka. Ketuk untuk bermain." : "Selesaikan level " + i + " dulu."}</p></button>`;
          },
        ).join(
          "",
        )}${allDone() ? `<button class='card text-left' data-a='${S.c1 ? "cert" : "fin"}'><span class='text-4xl'>🏅</span><p class='hd text-xl mt-1'>Sertifikat</p><p class='text-[var(--mut)]'>Semua misi selesai. Ketuk untuk membuka.</p></button>` : ""}</div>`;
      const fin = () =>
        `<div class='card max-w-xl mx-auto mt-4 text-center'><div class='stamp text-xl mb-2'>KASUS DITUTUP</div><h2 class='hd text-3xl'>Semua misi selesai!</h2><p class='mt-2 font-bold'>Seberapa yakin kamu sekarang?</p>${faces("c1")}${msg()}<button class='btn hl mt-5' data-a='cert'>Lihat sertifikat</button></div>`;
      function cert() {
        const { st, T, sc } = stat(),
          e = S.err,
          m = Math.max(...Object.values(e), 1),
          w = (a, b) =>
            `<div style='display:flex;justify-content:space-between;border-bottom:1px solid #b9d0cb;padding:.5cqw 0'><span>${a}</span><b>${b}</b></div>`;
        return `<div class='grid gap-5 max-w-4xl mx-auto'><div class='pg'><p class='hd' style='font-size:2.2cqw'>Detektif Junior</p><p class='hd' style='font-size:5.5cqw;margin-top:4cqw'>Sertifikat Penyelesaian</p><p style='font-size:1.9cqw;margin-top:3cqw'>diberikan kepada</p><p class='hd' style='font-size:5cqw;border-bottom:.3cqw solid #12293f;display:inline-block;padding-right:3cqw'>${esc(S.name)}</p><p style='font-size:2.4cqw;margin-top:1cqw'>Kelas ${esc(S.kelas)}</p><p style='font-size:1.8cqw;margin-top:3cqw;max-width:56%;line-height:1.5'>telah menyelesaikan seluruh 5 level dan 6 misi, serta menunjukkan kemampuan mengenali masalah, memilah data, menyusun strategi, dan menghitung secara mandiri.</p><p style='font-size:1.6cqw;position:absolute;bottom:5cqw'>${S.dt}</p><div style='position:absolute;right:7cqw;top:20cqw;text-align:center'><p style='font-size:1.8cqw'>Skor akhir</p><p class='hd' style='font-size:12cqw;line-height:1'>${sc}</p><p style='font-size:1.8cqw;font-weight:700'>${pred(sc)}</p></div></div>
      <div class='pg'><p class='hd' style='font-size:3.6cqw'>Rincian statistik belajar</p><p style='font-size:1.8cqw'>${esc(S.name)}, kelas ${esc(S.kelas)}</p><div style='display:grid;grid-template-columns:1fr 1.2fr;gap:4cqw;margin-top:3cqw;font-size:1.7cqw'><div>${w("Misi selesai", Q.length + " dari " + Q.length)}${w("Bintang", T + " dari " + Q.length * 3)}${w("Petunjuk dipakai", S.hu + " kali")}${w("Keyakinan diri", S.c0 + "/5 ke " + S.c1 + "/5")}<p class='hd' style='margin:2cqw 0 .5cqw'>Kesalahan per tahap</p>${Object.keys(
        e,
      )
        .map(
          (k) =>
            `<div style='margin-bottom:.8cqw'>${NM[k]}: <b>${e[k]}</b><div style='height:1cqw;background:#ffd23f;width:${(e[k] / m) * 100}%'></div></div>`,
        )
        .join(
          "",
        )}</div><div><p class='hd' style='margin-bottom:.5cqw'>Hasil per misi</p>${st.map((x, i) => w(i + 1 + ". " + CASES[i].n, x.s + "/3 bintang, " + x.e + " salah")).join("")}</div></div></div></div><div class='flex flex-wrap gap-3 justify-center mt-4'><button class='btn hl' data-a='pdf'>Simpan sebagai PDF</button><button class='btn ghost' data-a='go'>Pilihan level</button></div>`;
      }
      async function pdf() {
        const { st, T, sc } = stat(),
          e = S.err,
          { jsPDF } = window.jspdf,
          d = new jsPDF({ orientation: "landscape", unit: "mm", format: "a4" }),
          N = [18, 41, 63];
        const t = (s, x, y, z, b, al) => {
          d.setFont("helvetica", b ? "bold" : "normal");
          d.setFontSize(z);
          d.setTextColor(...N);
          d.text(String(s), x, y, { align: al || "left" });
        };
        const bd = () => {
          d.setFillColor(255, 210, 63);
          d.rect(0, 0, 8, 210, "F");
          d.setDrawColor(...N);
          d.setLineWidth(0.4);
          d.rect(14, 12, 271, 186);
        };
        bd();
        t("Detektif Junior", 26, 30, 14, 1);
        t("Sertifikat Penyelesaian", 26, 64, 34, 1);
        t("diberikan kepada", 26, 82, 13);
        t(S.name, 26, 100, 30, 1);
        d.line(26, 104, 150, 104);
        t("Kelas " + S.kelas, 26, 114, 16);
        d.setFontSize(12);
        d.text(
          d.splitTextToSize(
            "telah menyelesaikan seluruh 5 level dan 6 misi, serta menunjukkan kemampuan mengenali masalah, memilah data, menyusun strategi, dan menghitung secara mandiri.",
            140,
          ),
          26,
          132,
        );
        t("Skor akhir", 235, 80, 13, 0, "center");
        t(sc, 235, 112, 64, 1, "center");
        t(pred(sc), 235, 126, 14, 1, "center");
        t(S.dt, 26, 184, 11);
        d.addPage();
        bd();
        t("Rincian statistik belajar", 26, 30, 24, 1);
        t(S.name + ", kelas " + S.kelas, 26, 40, 12);
        [
          ["Misi selesai", Q.length + " dari " + Q.length],
          ["Bintang", T + " dari " + Q.length * 3],
          ["Petunjuk dipakai", S.hu + " kali"],
          ["Keyakinan diri", S.c0 + "/5 ke " + S.c1 + "/5"],
        ].forEach((r, i) => {
          t(r[0], 26, 62 + i * 10, 12);
          t(r[1], 118, 62 + i * 10, 12, 1, "right");
          d.line(26, 64 + i * 10, 118, 64 + i * 10);
        });
        t("Kesalahan per tahap", 26, 114, 13, 1);
        const m = Math.max(...Object.values(e), 1);
        Object.keys(e).forEach((k, i) => {
          const y = 126 + i * 12;
          t(NM[k], 26, y, 11);
          d.setFillColor(255, 210, 63);
          d.rect(52, y - 4, Math.max((e[k] / m) * 55, 1), 5, "F");
          t(e[k], 112, y, 11, 1, "right");
        });
        t("Hasil per misi", 150, 62, 13, 1);
        t("Bintang", 250, 62, 11, 1, "right");
        t("Salah", 272, 62, 11, 1, "right");
        st.forEach((x, i) => {
          const y = 74 + i * 11;
          t(i + 1 + ". " + CASES[i].n, 150, y, 11);
          t(x.s + "/3", 250, y, 11, 0, "right");
          t(x.e, 272, y, 11, 0, "right");
          d.line(150, y + 2.5, 276, y + 2.5);
        });
        const fn = "Sertifikat-" + S.name.split(" ").join("-") + ".pdf";
        try {
          const dl = window.claude
            ? await window.claude.use("downloads")
            : null;
          if (dl) {
            await dl.save({ filename: fn, data: d.output("blob") });
            return;
          }
        } catch (x) {
          if (x && x.code == "declined") return;
        }
        d.save(fn);
      }
      document.addEventListener("input", (e) => {
        if (e.target.id == "nm") S.name = e.target.value;
        if (e.target.id == "kl") S.kelas = e.target.value;
      });
      document.addEventListener("keydown", (e) => {
        if (e.key == "Enter" && e.target.id == "in") run();
      });
      R();
    </script>
  </body>
</html>
